<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240"><title>把设定图册，变成连续剧情图像</title><rect width="1600" height="1240" fill="#f5f3ef"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="64" y="53" font-size="18" fill="#375577" font-weight="bold">SOP 02 / CIVILIZATION PRODUCTION</text><text x="64" y="119" font-size="45" fill="#283942" font-weight="bold">把设定图册，变成连续剧情图像</text><rect x="64" y="158" width="1472" height="93" rx="15" fill="#e5e8e4"/><text x="88" y="194" font-size="24" fill="#283942" font-weight="bold">输入  世界观 ＋ 逐镜脚本 ＋ 实际设定图 ＋ handoff.json</text><text x="88" y="230" font-size="24" fill="#283942" font-weight="normal">输出  真实剧情图片 ＋ 图像清单 ＋ 提示词与一致性检查</text><rect x="64" y="285" width="468" height="205" rx="15" fill="#ffffff"/><rect x="64" y="285" width="468" height="48" rx="15" fill="#375577"/><text x="83" y="317" font-size="24" fill="#ffffff" font-weight="bold">01  校验上游交付</text><text x="85" y="371" font-size="21" fill="#375577" font-weight="bold">Codex · 文件与 JSON 检查</text><text x="85" y="417" font-size="22" fill="#283942" font-weight="normal">核对版本、实体 ID 和图片路径</text><text x="85" y="459" font-size="20" fill="#65727b" font-weight="normal">输出 image-input-check.md</text><rect x="566" y="285" width="468" height="205" rx="15" fill="#ffffff"/><rect x="566" y="285" width="468" height="48" rx="15" fill="#375577"/><text x="585" y="317" font-size="24" fill="#ffffff" font-weight="bold">02  确认生图路线</text><text x="587" y="371" font-size="21" fill="#375577" font-weight="bold">工具发现 · Image2 帮助</text><text x="587" y="417" font-size="22" fill="#283942" font-weight="normal">核验参考能力、参数与授权</text><text x="587" y="459" font-size="20" fill="#65727b" font-weight="normal">输出 image-provider.md</text><rect x="1068" y="285" width="468" height="205" rx="15" fill="#ffffff"/><rect x="1068" y="285" width="468" height="48" rx="15" fill="#375577"/><text x="1087" y="317" font-size="24" fill="#ffffff" font-weight="bold">03  编制图像生产矩阵</text><text x="1089" y="371" font-size="21" fill="#375577" font-weight="bold">Codex · 镜头拆解</text><text x="1089" y="417" font-size="22" fill="#283942" font-weight="normal">建立／行动／证据，各有用途</text><text x="1089" y="459" font-size="20" fill="#65727b" font-weight="normal">输出 image_plan.json</text><rect x="1068" y="527" width="468" height="205" rx="15" fill="#ffffff"/><rect x="1068" y="527" width="468" height="48" rx="15" fill="#375577"/><text x="1087" y="559" font-size="24" fill="#ffffff" font-weight="bold">04  先做一张代表帧</text><text x="1089" y="613" font-size="21" fill="#375577" font-weight="bold">imagegen 或已配置 Image2</text><text x="1089" y="659" font-size="22" fill="#283942" font-weight="normal">用真实母图约束身份和结构</text><text x="1089" y="701" font-size="20" fill="#65727b" font-weight="normal">看图通过后再派生</text><rect x="566" y="527" width="468" height="205" rx="15" fill="#ffffff"/><rect x="566" y="527" width="468" height="48" rx="15" fill="#375577"/><text x="585" y="559" font-size="24" fill="#ffffff" font-weight="bold">05  生成其余连续帧</text><text x="587" y="613" font-size="21" fill="#375577" font-weight="bold">同一生图／参考编辑路线</text><text x="587" y="659" font-size="22" fill="#283942" font-weight="normal">保持方位、持物和损伤进度</text><text x="587" y="701" font-size="20" fill="#65727b" font-weight="normal">输出 images/*.png</text><rect x="64" y="527" width="468" height="205" rx="15" fill="#ffffff"/><rect x="64" y="527" width="468" height="48" rx="15" fill="#375577"/><text x="83" y="559" font-size="24" fill="#ffffff" font-weight="bold">06  逐张与整组验收</text><text x="85" y="613" font-size="21" fill="#375577" font-weight="bold">看图 · 接触表 · 文件校验</text><text x="85" y="659" font-size="22" fill="#283942" font-weight="normal">像素内容与前后关系同时通过</text><text x="85" y="701" font-size="20" fill="#65727b" font-weight="normal">输出 image_manifest.json</text><polyline points="536,385 558,385" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="551,380 558,385 551,390" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1038,385 1060,385" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1053,380 1060,385 1053,390" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1302,495 1302,519" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1297,512 1302,519 1307,512" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1062,629 1040,629" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1047,624 1040,629 1047,634" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="560,629 538,629" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="545,624 538,629 545,634" fill="none" stroke="#8a969d" stroke-width="3"/><text x="64" y="790" font-size="28" fill="#375577" font-weight="bold">一个故事节点，需要准备什么？</text><rect x="64" y="812" width="468" height="72" rx="15" fill="#e5e8e4"/><text x="82" y="856" font-size="21" fill="#283942" font-weight="normal">通常 3 张：建立／行动／证据</text><rect x="566" y="812" width="468" height="72" rx="15" fill="#e5e8e4"/><text x="584" y="856" font-size="21" fill="#283942" font-weight="normal">每张：提示词 ＋ 实际参考映射</text><rect x="1068" y="812" width="468" height="72" rx="15" fill="#e5e8e4"/><text x="1086" y="856" font-size="21" fill="#283942" font-weight="normal">1 份接触表 ＋ QA ＋ 图像清单</text><text x="64" y="933" font-size="23" fill="#283942" font-weight="bold">参数  继承视频画幅 ｜ 默认目标 1920×1080 ｜ 按动作增减帧数，不机械凑三张</text><text x="64" y="982" font-size="23" fill="#283942" font-weight="normal">合格  人物不漂移 · 地点不镜像 · 证据清楚 · 动作有空间 · 关键帧覆盖完整</text><text x="64" y="1031" font-size="22" fill="#283942" font-weight="normal">返工  身份漂移 → 重附母图局部编辑；下载损坏 → 重下载原任务，避免重复生成</text><rect x="64" y="1070" width="1472" height="95" rx="15" fill="#e8e4db"/><text x="86" y="1107" font-size="23" fill="#283942" font-weight="normal">版本与命名：实体／节点 ID 稳定，单资产用 v001 迭代，设定变更提升 revision</text><text x="86" y="1144" font-size="22" fill="#625b50" font-weight="normal">例：atl_SEG-001_SH-001-01_start_v002.png    ｜    所有实际文件均按清单交接</text><text x="64" y="1210" font-size="18" fill="#65727b" font-weight="normal">配套完整手册包含逐步格式、可复制提示词、故障表与可填节点资产 JSON。图中为流程说明，非生成资产样片。</text></g></svg>