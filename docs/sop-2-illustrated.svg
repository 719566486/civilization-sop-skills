<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240"><ns0:title>把设定图册，变成连续剧情图像</ns0:title><ns0:rect width="1600" height="1240" fill="#f5f3ef" /><ns0:g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><ns0:text x="64" y="53" font-size="18" fill="#375577" font-weight="bold">SOP 02 / CIVILIZATION PRODUCTION</ns0:text><ns0:text x="64" y="119" font-size="45" fill="#283942" font-weight="bold">把设定图册，变成连续剧情图像</ns0:text><ns0:rect x="64" y="158" width="1472" height="93" rx="15" fill="#e5e8e4" /><ns0:text x="88" y="194" font-size="24" fill="#283942" font-weight="bold">输入  世界观 ＋ 逐镜脚本 ＋ 实际设定图 ＋ handoff.json</ns0:text><ns0:text x="88" y="230" font-size="24" fill="#283942" font-weight="normal">输出  真实剧情图片 ＋ 图像清单 ＋ 提示词与一致性检查</ns0:text><ns0:rect x="64" y="285" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="64" y="285" width="468" height="48" rx="15" fill="#375577" /><ns0:text x="83" y="317" font-size="24" fill="#ffffff" font-weight="bold">01  校验上游交付</ns0:text><ns0:text x="85" y="371" font-size="21" fill="#375577" font-weight="bold">Codex · 文件与 JSON 检查</ns0:text><ns0:text x="85" y="417" font-size="22" fill="#283942" font-weight="normal">核对快照、制作引用与图像路径</ns0:text><ns0:text x="85" y="459" font-size="20" fill="#65727b" font-weight="normal">输出 image_input_check.md</ns0:text><ns0:rect x="566" y="285" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="566" y="285" width="468" height="48" rx="15" fill="#375577" /><ns0:text x="585" y="317" font-size="24" fill="#ffffff" font-weight="bold">02  确认生图路线</ns0:text><ns0:text x="587" y="371" font-size="21" fill="#375577" font-weight="bold">工具发现 · Image2 帮助</ns0:text><ns0:text x="587" y="417" font-size="22" fill="#283942" font-weight="normal">核验参考能力、参数与授权</ns0:text><ns0:text x="587" y="459" font-size="20" fill="#65727b" font-weight="normal">输出 image_provider.md</ns0:text><ns0:rect x="1068" y="285" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="1068" y="285" width="468" height="48" rx="15" fill="#375577" /><ns0:text x="1087" y="317" font-size="24" fill="#ffffff" font-weight="bold">03  编制图像生产矩阵</ns0:text><ns0:text x="1089" y="371" font-size="21" fill="#375577" font-weight="bold">Codex · 镜头拆解</ns0:text><ns0:text x="1089" y="417" font-size="22" fill="#283942" font-weight="normal">建立／行动／证据，各有用途</ns0:text><ns0:text x="1089" y="459" font-size="20" fill="#65727b" font-weight="normal">输出 image_plan.json</ns0:text><ns0:rect x="1068" y="527" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="1068" y="527" width="468" height="48" rx="15" fill="#375577" /><ns0:text x="1087" y="559" font-size="24" fill="#ffffff" font-weight="bold">04  先做一张代表帧</ns0:text><ns0:text x="1089" y="613" font-size="21" fill="#375577" font-weight="bold">imagegen 或已配置 Image2</ns0:text><ns0:text x="1089" y="659" font-size="22" fill="#283942" font-weight="normal">用真实母图约束身份和结构</ns0:text><ns0:text x="1089" y="701" font-size="20" fill="#65727b" font-weight="normal">看图通过后再派生</ns0:text><ns0:rect x="566" y="527" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="566" y="527" width="468" height="48" rx="15" fill="#375577" /><ns0:text x="585" y="559" font-size="24" fill="#ffffff" font-weight="bold">05  生成其余连续帧</ns0:text><ns0:text x="587" y="613" font-size="21" fill="#375577" font-weight="bold">同一生图／参考编辑路线</ns0:text><ns0:text x="587" y="659" font-size="22" fill="#283942" font-weight="normal">保持方位、持物和损伤进度</ns0:text><ns0:text x="587" y="701" font-size="20" fill="#65727b" font-weight="normal">输出 reference/*.png</ns0:text><ns0:rect x="64" y="527" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="64" y="527" width="468" height="48" rx="15" fill="#375577" /><ns0:text x="83" y="559" font-size="24" fill="#ffffff" font-weight="bold">06  逐张与整组验收</ns0:text><ns0:text x="85" y="613" font-size="21" fill="#375577" font-weight="bold">看图 · 接触表 · 文件校验</ns0:text><ns0:text x="85" y="659" font-size="22" fill="#283942" font-weight="normal">检查像素、连续性与交付信息</ns0:text><ns0:text x="85" y="701" font-size="20" fill="#65727b" font-weight="normal">输出 image_delivery.json</ns0:text><ns0:polyline points="536,385 558,385" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="551,380 558,385 551,390" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1038,385 1060,385" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1053,380 1060,385 1053,390" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1302,495 1302,519" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1297,512 1302,519 1307,512" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1062,629 1040,629" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1047,624 1040,629 1047,634" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="560,629 538,629" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="545,624 538,629 545,634" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:text x="64" y="790" font-size="28" fill="#375577" font-weight="bold">一个故事节点，需要准备什么？</ns0:text><ns0:rect x="64" y="812" width="468" height="72" rx="15" fill="#e5e8e4" /><ns0:text x="82" y="856" font-size="21" fill="#283942" font-weight="normal">通常 3 张：建立／行动／证据</ns0:text><ns0:rect x="566" y="812" width="468" height="72" rx="15" fill="#e5e8e4" /><ns0:text x="584" y="856" font-size="21" fill="#283942" font-weight="normal">每张：提示词 ＋ 实际参考映射</ns0:text><ns0:rect x="1068" y="812" width="468" height="72" rx="15" fill="#e5e8e4" /><ns0:text x="1086" y="856" font-size="21" fill="#283942" font-weight="normal">1 份接触表 ＋ QA ＋ 图像清单</ns0:text><ns0:text x="64" y="933" font-size="23" fill="#283942" font-weight="bold">参数  继承视频画幅 ｜ 默认目标 1920×1080 ｜ 按动作增减帧数，不机械凑三张</ns0:text><ns0:text x="64" y="982" font-size="23" fill="#283942" font-weight="normal">合格  人物不漂移 · 地点不镜像 · 证据清楚 · 动作有空间 · 关键帧覆盖完整</ns0:text><ns0:text x="64" y="1031" font-size="22" fill="#283942" font-weight="normal">返工  身份漂移 → 重附母图局部编辑；下载损坏 → 重下载原任务，避免重复生成</ns0:text><ns0:rect x="64" y="1070" width="1472" height="95" rx="15" fill="#e8e4db" /><ns0:text x="86" y="1107" font-size="23" fill="#283942" font-weight="normal">正式美术命名：snake_case · 历史 rNNN · 运行时稳定路径 · ID / Key / Manifest 由开发登记</ns0:text><ns0:text x="86" y="1144" font-size="22" fill="#625b50" font-weight="normal">例：history/ch01_signal03_r002.mp4   →   开发确认后 runtime/ch01_signal03.mp4</ns0:text><ns0:text x="64" y="1210" font-size="18" fill="#65727b" font-weight="normal">配套完整手册包含逐步格式、可复制提示词、故障表与可填节点资产 JSON。图中为流程说明，非生成资产样片。</ns0:text></ns0:g></ns0:svg>