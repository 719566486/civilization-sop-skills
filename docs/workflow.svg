<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>从一句文明想法到可用视频资产</title><desc>三个SOP串联世界观、脚本、真实设定图册、剧情关键帧和15至20秒视频；Traveller与飞行器作为跨文明母资产。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#88939e" stroke-width="1.5"/></marker></defs><rect width="1600" height="900" fill="#f5f3ef"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="65" font-size="18" fill="#63717c" font-weight="normal">CIVILIZATION PRODUCTION / 三个可独立调用的 SOP</text><text x="70" y="126" font-size="46" fill="#213039" font-weight="bold">从一句文明想法，到一组可用视频</text><text x="70" y="168" font-size="23" fill="#63717c" font-weight="normal">让世界有逻辑，让资产保持一致，让 Traveller 的探索真正动起来。</text><rect x="70" y="205" width="1460" height="77" rx="18" fill="#e6e9e5"/><text x="96" y="239" font-size="25" fill="#213039" font-weight="bold">输入：创建一个亚特兰蒂斯文明</text><text x="96" y="266" font-size="18" fill="#63717c" font-weight="normal">复用 Traveller／飞行器等已有母资产；新文明的人物、物品和地点重新设计</text><rect x="70" y="325" width="460" height="352" rx="18" fill="#ffffff"/><rect x="70" y="325" width="460" height="90" rx="18" fill="#234e49"/><text x="92" y="358" font-size="16" fill="#ffffff" font-weight="normal">SOP 01</text><text x="92" y="394" font-size="30" fill="#ffffff" font-weight="bold">文明创作总设定</text><text x="92" y="448" font-size="21" fill="#234e49" font-weight="bold">一句话 → 三份图文交付</text><rect x="570" y="325" width="460" height="352" rx="18" fill="#ffffff"/><rect x="570" y="325" width="460" height="90" rx="18" fill="#375577"/><text x="592" y="358" font-size="16" fill="#ffffff" font-weight="normal">SOP 02</text><text x="592" y="394" font-size="30" fill="#ffffff" font-weight="bold">图像资产生产</text><text x="592" y="448" font-size="21" fill="#375577" font-weight="bold">三份交付 → 剧情关键帧</text><rect x="1070" y="325" width="460" height="352" rx="18" fill="#ffffff"/><rect x="1070" y="325" width="460" height="90" rx="18" fill="#785d42"/><text x="1092" y="358" font-size="16" fill="#ffffff" font-weight="normal">SOP 03</text><text x="1092" y="394" font-size="30" fill="#ffffff" font-weight="bold">视频资产生产</text><text x="1092" y="448" font-size="21" fill="#785d42" font-weight="bold">脚本＋设定图＋关键帧 → 视频</text><text x="92" y="500" font-size="20" fill="#384952" font-weight="normal">① 世界观：文明如何运作</text><text x="92" y="542" font-size="20" fill="#384952" font-weight="normal">② 探索脚本：动作、证据与镜头</text><text x="92" y="584" font-size="20" fill="#384952" font-weight="normal">③ 设定图册：人物／物品／地点</text><text x="92" y="626" font-size="20" fill="#384952" font-weight="normal">含真实参考图，锁定身份与空间</text><text x="592" y="500" font-size="20" fill="#384952" font-weight="normal">Codex 内置 imagegen 或 Image2</text><text x="592" y="542" font-size="20" fill="#384952" font-weight="normal">建立镜头 → 行动关系 → 关键证据</text><text x="592" y="584" font-size="20" fill="#384952" font-weight="normal">按母图派生，检查比例与连续性</text><text x="592" y="626" font-size="20" fill="#384952" font-weight="normal">输出真实图片＋镜头对应清单</text><text x="1092" y="500" font-size="20" fill="#384952" font-weight="normal">先检查 Kling／Flova 及后期能力</text><text x="1092" y="542" font-size="20" fill="#384952" font-weight="normal">按镜头生成，检查动作和接续</text><text x="1092" y="584" font-size="20" fill="#384952" font-weight="normal">按需对白、字幕、音乐与收束</text><text x="1092" y="626" font-size="20" fill="#384952" font-weight="normal">交付每条 15–20 秒 MP4</text><path d="M535,510 L563,510" fill="none" stroke="#88939e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1035,510 L1063,510" fill="none" stroke="#88939e" stroke-width="3" marker-end="url(#arrow)"/><path d="M300,687 L300,733 L1300,733 L1300,687" fill="none" stroke="#8d979c" stroke-width="2" marker-end="url(#arrow)"/><text x="481" y="724" font-size="21" fill="#63717c" font-weight="normal">脚本与设定图全程传递，避免信息在中途丢失</text><rect x="70" y="775" width="1460" height="64" rx="18" fill="#e8e4db"/><text x="96" y="815" font-size="23" fill="#554f43" font-weight="normal">共同规则：版本唯一  ·  母资产复用  ·  不合格局部返修  ·  实际文件验收后再交接</text><text x="70" y="874" font-size="17" fill="#63717c" font-weight="normal">说明：SOP 1 的设定图与 SOP 2 的剧情关键帧用途不同；工具和费用在实际生成前核验。</text></g></svg>
