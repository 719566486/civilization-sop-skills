<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240"><title>把一句想法，变成可制作的文明</title><rect width="1600" height="1240" fill="#f5f3ef"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="64" y="53" font-size="18" fill="#234e49" font-weight="bold">SOP 01 / CIVILIZATION PRODUCTION</text><text x="64" y="119" font-size="45" fill="#283942" font-weight="bold">把一句想法，变成可制作的文明</text><rect x="64" y="158" width="1472" height="93" rx="15" fill="#e5e8e4"/><text x="88" y="194" font-size="24" fill="#283942" font-weight="bold">输入  一句文明描述 ＋ 可复用的 Traveller／飞行器母图</text><text x="88" y="230" font-size="24" fill="#283942" font-weight="normal">输出  世界观.md ＋ 探索脚本.md ＋ 含真实图片的设定图册</text><rect x="64" y="285" width="468" height="205" rx="15" fill="#ffffff"/><rect x="64" y="285" width="468" height="48" rx="15" fill="#234e49"/><text x="83" y="317" font-size="24" fill="#ffffff" font-weight="bold">01  锁定有效资料</text><text x="85" y="371" font-size="21" fill="#234e49" font-weight="bold">Codex · 文件读取</text><text x="85" y="417" font-size="22" fill="#283942" font-weight="normal">区分有效稿、历史稿与缺失项</text><text x="85" y="459" font-size="20" fill="#65727b" font-weight="normal">输出 sources.md / brief.json</text><rect x="566" y="285" width="468" height="205" rx="15" fill="#ffffff"/><rect x="566" y="285" width="468" height="48" rx="15" fill="#234e49"/><text x="585" y="317" font-size="24" fill="#ffffff" font-weight="bold">02  建立世界运作逻辑</text><text x="587" y="371" font-size="21" fill="#234e49" font-weight="bold">Codex · 写作与资料核验</text><text x="587" y="417" font-size="22" fill="#283942" font-weight="normal">资源、社会、历史、技术与视觉</text><text x="587" y="459" font-size="20" fill="#65727b" font-weight="normal">输出 01_world.md</text><rect x="1068" y="285" width="468" height="205" rx="15" fill="#ffffff"/><rect x="1068" y="285" width="468" height="48" rx="15" fill="#234e49"/><text x="1087" y="317" font-size="24" fill="#ffffff" font-weight="bold">03  拆解探索节点</text><text x="1089" y="371" font-size="21" fill="#234e49" font-weight="bold">Codex · 编剧与时间核算</text><text x="1089" y="417" font-size="22" fill="#283942" font-weight="normal">目标 → 行动 → 证据 → 判断</text><text x="1089" y="459" font-size="20" fill="#65727b" font-weight="normal">输出 15–20 秒逐镜表</text><rect x="1068" y="527" width="468" height="205" rx="15" fill="#ffffff"/><rect x="1068" y="527" width="468" height="48" rx="15" fill="#234e49"/><text x="1087" y="559" font-size="24" fill="#ffffff" font-weight="bold">04  列出人物与场景资产</text><text x="1089" y="613" font-size="21" fill="#234e49" font-weight="bold">Codex · 资产清单</text><text x="1089" y="659" font-size="22" fill="#283942" font-weight="normal">区分全局复用与本文明新增</text><text x="1089" y="701" font-size="20" fill="#65727b" font-weight="normal">输出 design_plan.json</text><rect x="566" y="527" width="468" height="205" rx="15" fill="#ffffff"/><rect x="566" y="527" width="468" height="48" rx="15" fill="#234e49"/><text x="585" y="559" font-size="24" fill="#ffffff" font-weight="bold">05  生成并锁定设定图</text><text x="587" y="613" font-size="21" fill="#234e49" font-weight="bold">imagegen 或已配置 Image2</text><text x="587" y="659" font-size="22" fill="#283942" font-weight="normal">先母图，再派生必要视角</text><text x="587" y="701" font-size="20" fill="#65727b" font-weight="normal">输出 designs/*.png</text><rect x="64" y="527" width="468" height="205" rx="15" fill="#ffffff"/><rect x="64" y="527" width="468" height="48" rx="15" fill="#234e49"/><text x="83" y="559" font-size="24" fill="#ffffff" font-weight="bold">06  验收与打包交接</text><text x="85" y="613" font-size="21" fill="#234e49" font-weight="bold">看图 ＋ 文件及版本校验</text><text x="85" y="659" font-size="22" fill="#283942" font-weight="normal">图册有实图、每镜有资产引用</text><text x="85" y="701" font-size="20" fill="#65727b" font-weight="normal">输出 handoff.json</text><polyline points="536,385 558,385" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="551,380 558,385 551,390" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1038,385 1060,385" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1053,380 1060,385 1053,390" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1302,495 1302,519" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1297,512 1302,519 1307,512" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1062,629 1040,629" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="1047,624 1040,629 1047,634" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="560,629 538,629" fill="none" stroke="#8a969d" stroke-width="3"/><polyline points="545,624 538,629 545,634" fill="none" stroke="#8a969d" stroke-width="3"/><text x="64" y="790" font-size="28" fill="#234e49" font-weight="bold">一个故事节点，需要准备什么？</text><rect x="64" y="812" width="468" height="72" rx="15" fill="#e5e8e4"/><text x="82" y="856" font-size="21" fill="#283942" font-weight="normal">1 张节点卡 ＋ 1 份逐镜表</text><rect x="566" y="812" width="468" height="72" rx="15" fill="#e5e8e4"/><text x="584" y="856" font-size="21" fill="#283942" font-weight="normal">出镜人物／物品：各 1 套母图</text><rect x="1068" y="812" width="468" height="72" rx="15" fill="#e5e8e4"/><text x="1086" y="856" font-size="21" fill="#283942" font-weight="normal">每个地点：总览与空间关系图</text><text x="64" y="933" font-size="23" fill="#283942" font-weight="bold">参数  节点 15–20 秒 ｜ 场景默认 16:9 ｜ 图像参数按实际工具能力映射</text><text x="64" y="982" font-size="23" fill="#283942" font-weight="normal">合格  世界有逻辑 · 剧情有因果 · 多视图一致 · 必需设定图全部存在</text><text x="64" y="1031" font-size="22" fill="#283942" font-weight="normal">返工  设定冲突 → 锁定有效版本；缺图／视图矛盾 → 补图或从母图局部返修</text><rect x="64" y="1070" width="1472" height="95" rx="15" fill="#e8e4db"/><text x="86" y="1107" font-size="23" fill="#283942" font-weight="normal">版本与命名：实体／节点 ID 稳定，单资产用 v001 迭代，设定变更提升 revision</text><text x="86" y="1144" font-size="22" fill="#625b50" font-weight="normal">例：atl_SEG-001_SH-001-01_start_v002.png    ｜    所有实际文件均按清单交接</text><text x="64" y="1210" font-size="18" fill="#65727b" font-weight="normal">配套完整手册包含逐步格式、可复制提示词、故障表与可填节点资产 JSON。图中为流程说明，非生成资产样片。</text></g></svg>