<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240"><ns0:title>把剧情关键帧，变成可用短视频</ns0:title><ns0:rect width="1600" height="1240" fill="#f5f3ef" /><ns0:g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><ns0:text x="64" y="53" font-size="18" fill="#785d42" font-weight="bold">SOP 03 / CIVILIZATION PRODUCTION</ns0:text><ns0:text x="64" y="119" font-size="45" fill="#283942" font-weight="bold">把剧情关键帧，变成可用短视频</ns0:text><ns0:rect x="64" y="158" width="1472" height="93" rx="15" fill="#e5e8e4" /><ns0:text x="88" y="194" font-size="24" fill="#283942" font-weight="bold">输入  探索脚本 ＋ 实体设定图 ＋ 已通过的剧情关键帧</ns0:text><ns0:text x="88" y="230" font-size="24" fill="#283942" font-weight="normal">输出  每节点 1 条 15–20 秒 MP4 ＋ 实际参数及验收记录</ns0:text><ns0:rect x="64" y="285" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="64" y="285" width="468" height="48" rx="15" fill="#785d42" /><ns0:text x="83" y="317" font-size="24" fill="#ffffff" font-weight="bold">01  检查素材与配置</ns0:text><ns0:text x="85" y="371" font-size="21" fill="#785d42" font-weight="bold">Kling MCP / Flova CLI</ns0:text><ns0:text x="85" y="417" font-size="22" fill="#283942" font-weight="normal">检查两条路线，选择可用的一条</ns0:text><ns0:text x="85" y="459" font-size="20" fill="#65727b" font-weight="normal">核对后期能力及已有授权</ns0:text><ns0:rect x="566" y="285" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="566" y="285" width="468" height="48" rx="15" fill="#785d42" /><ns0:text x="585" y="317" font-size="24" fill="#ffffff" font-weight="bold">02  编译镜头任务</ns0:text><ns0:text x="587" y="371" font-size="21" fill="#785d42" font-weight="bold">Codex · 实时接口说明</ns0:text><ns0:text x="587" y="417" font-size="22" fill="#283942" font-weight="normal">目标时长与生成时长分开</ns0:text><ns0:text x="587" y="459" font-size="20" fill="#65727b" font-weight="normal">输出 video_plan.json</ns0:text><ns0:rect x="1068" y="285" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="1068" y="285" width="468" height="48" rx="15" fill="#785d42" /><ns0:text x="1087" y="317" font-size="24" fill="#ffffff" font-weight="bold">03  上传并生成原片</ns0:text><ns0:text x="1089" y="371" font-size="21" fill="#785d42" font-weight="bold">Kling 或 Flova</ns0:text><ns0:text x="1089" y="417" font-size="22" fill="#283942" font-weight="normal">真实参考映射，保存任务 ID</ns0:text><ns0:text x="1089" y="459" font-size="20" fill="#65727b" font-weight="normal">输出原始 MP4 与回执</ns0:text><ns0:rect x="1068" y="527" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="1068" y="527" width="468" height="48" rx="15" fill="#785d42" /><ns0:text x="1087" y="559" font-size="24" fill="#ffffff" font-weight="bold">04  按需剪辑和声音</ns0:text><ns0:text x="1089" y="613" font-size="21" fill="#785d42" font-weight="bold">FFmpeg 或 HyperFrames</ns0:text><ns0:text x="1089" y="659" font-size="22" fill="#283942" font-weight="normal">按需字幕／对白／BGM／收束</ns0:text><ns0:text x="1089" y="701" font-size="20" fill="#65727b" font-weight="normal">输出 ch01_signal03_r001.mp4</ns0:text><ns0:rect x="566" y="527" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="566" y="527" width="468" height="48" rx="15" fill="#785d42" /><ns0:text x="585" y="559" font-size="24" fill="#ffffff" font-weight="bold">05  实际视听与技术验收</ns0:text><ns0:text x="587" y="613" font-size="21" fill="#785d42" font-weight="bold">ffprobe · 解码 · 观看试听</ns0:text><ns0:text x="587" y="659" font-size="22" fill="#283942" font-weight="normal">测时长，检查整段动态及接点</ns0:text><ns0:text x="587" y="701" font-size="20" fill="#65727b" font-weight="normal">输出 video_review.md</ns0:text><ns0:rect x="64" y="527" width="468" height="205" rx="15" fill="#ffffff" /><ns0:rect x="64" y="527" width="468" height="48" rx="15" fill="#785d42" /><ns0:text x="83" y="559" font-size="24" fill="#ffffff" font-weight="bold">06  局部返修并交付</ns0:text><ns0:text x="85" y="613" font-size="21" fill="#785d42" font-weight="bold">原后端／后期工具</ns0:text><ns0:text x="85" y="659" font-size="22" fill="#283942" font-weight="normal">同用途修订，运行时名称不变</ns0:text><ns0:text x="85" y="701" font-size="20" fill="#65727b" font-weight="normal">输出 video_delivery.json</ns0:text><ns0:polyline points="536,385 558,385" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="551,380 558,385 551,390" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1038,385 1060,385" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1053,380 1060,385 1053,390" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1302,495 1302,519" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1297,512 1302,519 1307,512" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1062,629 1040,629" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="1047,624 1040,629 1047,634" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="560,629 538,629" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:polyline points="545,624 538,629 545,634" fill="none" stroke="#8a969d" stroke-width="3" /><ns0:text x="64" y="790" font-size="28" fill="#785d42" font-weight="bold">一个故事节点，需要准备什么？</ns0:text><ns0:rect x="64" y="812" width="468" height="72" rx="15" fill="#e5e8e4" /><ns0:text x="82" y="856" font-size="21" fill="#283942" font-weight="normal">覆盖镜头所需的真实关键帧</ns0:text><ns0:rect x="566" y="812" width="468" height="72" rx="15" fill="#e5e8e4" /><ns0:text x="584" y="856" font-size="21" fill="#283942" font-weight="normal">1 条或多条原片 → 1 条最终片</ns0:text><ns0:rect x="1068" y="812" width="468" height="72" rx="15" fill="#e5e8e4" /><ns0:text x="1086" y="856" font-size="21" fill="#283942" font-weight="normal">音频／字幕按需 ＋ 来源与 QA</ns0:text><ns0:text x="64" y="933" font-size="23" fill="#283942" font-weight="bold">参数  最终实测 15–20 秒 ｜ 默认 16:9 / 1080p ｜ 单次时长以当前模型为准</ns0:text><ns0:text x="64" y="982" font-size="23" fill="#283942" font-weight="normal">合格  解码成功 · 动作完整 · 身份及接镜连续 · 有声必试听 · 字幕对应实词</ns0:text><ns0:text x="64" y="1031" font-size="22" fill="#283942" font-weight="normal">返工  变形 → 简化动作或拆镜；台词截断 → 缩短／重排；文件坏 → 先重下载</ns0:text><ns0:rect x="64" y="1070" width="1472" height="95" rx="15" fill="#e8e4db" /><ns0:text x="86" y="1107" font-size="23" fill="#283942" font-weight="normal">正式美术命名：snake_case · 历史 rNNN · 运行时稳定路径 · ID / Key / Manifest 由开发登记</ns0:text><ns0:text x="86" y="1144" font-size="22" fill="#625b50" font-weight="normal">例：history/ch01_signal03_r002.mp4   →   开发确认后 runtime/ch01_signal03.mp4</ns0:text><ns0:text x="64" y="1210" font-size="18" fill="#65727b" font-weight="normal">配套完整手册包含逐步格式、可复制提示词、故障表与可填节点资产 JSON。图中为流程说明，非生成资产样片。</ns0:text></ns0:g></ns0:svg>